name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core library and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test Uncage.Core.Tests/Uncage.Core.Tests.csproj -c Release
      - name: Compile app XAML and C# (no platform SDK)
        run: dotnet build Uncage/Uncage.csproj -c Release -p:UncageVerifyBuild=true

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SIGNING=""
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
            # Fail fast with a readable reason (apksigner only says "exited with code 2").
            if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/keytool.log" 2>&1; then
              sed 's/^/  keytool: /' "$RUNNER_TEMP/keytool.log"
              echo "::error::The release key secrets don't match: check ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (should be 'uncage') and that ANDROID_KEYSTORE_BASE64 was pasted completely. keytool said: $(grep -m1 -i 'error' "$RUNNER_TEMP/keytool.log")"
              exit 1
            fi
            SIGNING="-p:AndroidKeyStore=true -p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }} -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::No release key configured; this APK is signed with a throwaway debug key and can't update an installed copy."
          fi
          dotnet publish Uncage/Uncage.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -p:ApplicationVersion=${{ github.run_number }} $SIGNING
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: uncage-android
          path: Uncage/bin/Release/net10.0-android/publish/*-Signed.apk

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui-windows
      - name: Build Windows
        run: dotnet build Uncage/Uncage.csproj -f net10.0-windows10.0.19041.0 -c Release
