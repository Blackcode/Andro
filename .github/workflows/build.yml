name: build

# The APK is built here rather than by hand because GitHub's runners already carry the Android SDK and
# can reach Google's Maven repository, which is what the app's dependencies come from.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Detection engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # No Android SDK needed: the engine is a plain JVM library, which is the point of the split.
      - name: Run tests
        run: ./gradlew --no-daemon -Pcascoscan.includeApp=false :detection:test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: detection/build/reports/tests/test
          if-no-files-found: warn

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        # No --stacktrace: it buries the Kotlin compiler's own error lines under two hundred lines of
        # Gradle internals, which is exactly what you need to read when a build fails.
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cascoscan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Kept on failure too: the first real Android build of this module is the interesting one, and
      # the report says more than the console tail does.
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          if-no-files-found: ignore
