name: Build

on:
  push:
  pull_request:

jobs:
  core:
    name: Core library and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test Uncage.Core.Tests/Uncage.Core.Tests.csproj -c Release
      - name: Compile app XAML and C# (no platform SDK)
        run: dotnet build Uncage/Uncage.csproj -c Release -p:UncageVerifyBuild=true

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build APK
        run: dotnet publish Uncage/Uncage.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: uncage-android
          path: Uncage/bin/Release/net10.0-android/publish/*-Signed.apk

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui-windows
      - name: Build Windows
        run: dotnet build Uncage/Uncage.csproj -f net10.0-windows10.0.19041.0 -c Release
