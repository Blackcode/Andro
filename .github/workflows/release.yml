name: Release

# Push a version tag to publish a signed APK as a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
# (or draft a release on GitHub with a new v1.2.3 tag).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. Run tools/create-release-key.ps1 and add the secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Android only installs an update with a higher version code: derive it from the tag
          # (v1.2.3 -> 1002003) so it always increases and stays above regular CI builds.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          dotnet publish Uncage/Uncage.csproj -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion=$VERSION_CODE \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD
          cp Uncage/bin/Release/net10.0-android/publish/*-Signed.apk "Uncage-$VERSION.apk"
          sha256sum "Uncage-$VERSION.apk" > "Uncage-$VERSION.apk.sha256"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="Uncage $VERSION for Android.

          Install: download Uncage-$VERSION.apk on your phone and open it (allow installing from this source when asked).
          Every release is signed with the same key, so it installs as an update and keeps your chats.

          SHA-256: $(cut -d' ' -f1 "Uncage-$VERSION.apk.sha256")"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "Uncage-$VERSION.apk" "Uncage-$VERSION.apk.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "Uncage-$VERSION.apk" "Uncage-$VERSION.apk.sha256" \
              --title "Uncage $VERSION" --notes "$NOTES"
          fi
