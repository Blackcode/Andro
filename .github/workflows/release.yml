name: Release

# Publish a signed APK as a GitHub Release, either by pushing a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
# or from GitHub: Actions > Release > Run workflow, entering the version (creates the tag).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.0 (tag v1.0.0 is created from the selected branch)'
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - name: Check version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3 (got '${TAG#v}')."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore and check release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. Run tools/create-release-key.ps1 and add the secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Fail fast with a readable reason (apksigner only says "exited with code 2").
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/keytool.log" 2>&1; then
            sed 's/^/  keytool: /' "$RUNNER_TEMP/keytool.log"
            echo "::error::The release key secrets don't match: check ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (should be 'uncage') and that ANDROID_KEYSTORE_BASE64 was pasted completely. keytool said: $(grep -m1 -i 'error' "$RUNNER_TEMP/keytool.log")"
            exit 1
          fi

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          VERSION="${TAG#v}"
          # Android only installs an update with a higher version code: derive it from the tag
          # (v1.2.3 -> 1002003) so it always increases and stays above regular CI builds.
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          dotnet publish Uncage/Uncage.csproj -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:ApplicationDisplayVersion="$VERSION" \
            -p:ApplicationVersion=$VERSION_CODE \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD
          cp Uncage/bin/Release/net10.0-android/publish/*-Signed.apk "Uncage-$VERSION.apk"
          sha256sum "Uncage-$VERSION.apk" > "Uncage-$VERSION.apk.sha256"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          NOTES="Uncage $VERSION for Android.

          Install: download Uncage-$VERSION.apk on your phone and open it (allow installing from this source when asked).
          Every release is signed with the same key, so it installs as an update and keeps your chats.

          SHA-256: $(cut -d' ' -f1 "Uncage-$VERSION.apk.sha256")"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "Uncage-$VERSION.apk" "Uncage-$VERSION.apk.sha256" --clobber
          else
            # --target creates the tag on this exact commit when it doesn't exist yet (manual runs).
            gh release create "$TAG" "Uncage-$VERSION.apk" "Uncage-$VERSION.apk.sha256" \
              --target "$GITHUB_SHA" --title "Uncage $VERSION" --notes "$NOTES"
          fi
